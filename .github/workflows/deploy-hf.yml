name: Deploy to Hugging Face Spaces

# Pushes main to your Space after CI passes.
# One-time setup: add repository secret HF_TOKEN (a write token) and
# repository variable HF_SPACE (for example: your-username/deepshield).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
      - name: Add the Space config to the README
        # Spaces read their settings from YAML front matter in README.md. It is kept in
        # .github/hf-space-header.md so the GitHub README stays clean, and is added here
        # in a commit that only goes to the Space.
        run: |
          git config user.name "MoamenFouad"
          git config user.email "elsagir2004@gmail.com"
          cat .github/hf-space-header.md README.md > README.space.md
          mv README.space.md README.md
          git commit -qam "Add Space config"
      - name: Push to Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          test -n "$HF_TOKEN" || { echo "Missing HF_TOKEN secret"; exit 1; }
          test -n "$HF_SPACE" || { echo "Missing HF_SPACE variable"; exit 1; }
          HF_USER="${HF_SPACE%%/*}"
          git push --force "https://${HF_USER}:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" HEAD:main
